<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museo de pensamientos</title>
<meta name="description" content="Un paisaje nocturno que se llena de estrellas, flores y pasto cada vez que pienso en ti.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03050d">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef0f8;--dim:#98a5c8;--glass:rgba(10,15,34,.72);--line:rgba(180,200,255,.22);--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#03050d;overflow:hidden;font-family:var(--serif);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#title{position:fixed;left:0;top:0;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 0 calc(22px + env(safe-area-inset-left,0px));pointer-events:none}

#count{margin:.2rem 0 0;font-size:1.2rem;color:#c3cdee}
#etapa{margin:0;font-size:1rem;color:var(--dim)}

#txt{margin:.5rem 0 .2rem;font-style:italic;font-size:clamp(1.6rem,4.4vw,2.3rem);line-height:1.3;color:#f6f1e2}
#kind{margin:0 0 1rem;font-size:1.1rem;color:#b9c6ee}
#when{margin:.1rem 0 .8rem;font-size:1.1rem;color:#b9c6ee}
#what{margin:0 0 .9rem;font-style:italic;font-size:1.35rem;line-height:1.45;color:#f6f1e2;white-space:pre-wrap;overflow-wrap:anywhere}
#when:empty,#what:empty{display:none}
#card small{color:var(--dim);font-size:.95rem}
</style>
</head>
<body>
<canvas id="c" aria-label="Paisaje nocturno que crece con cada pensamiento"></canvas>

 {const x=-.08*mr,y=.62*mr;g.strokeStyle='rgba(255,255,245,.2)';g.lineWidth=1;for(let i=0;i<22;i++){const a=R(0,6.28),l=R(.2,.55)*mr;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}

 ctx.strokeStyle='#244848';ctx.lineWidth=1+it.s*.12;ctx.beginPath();ctx.moveTo(it.x,it.y);ctx.quadraticCurveTo(it.x+dx*.25,it.y-h*.6,tx,ty);ctx.stroke();
 const k=bright(it),pu=.7+.3*Math.sin(t*2+it.p),sc=Math.max(.15,p);
 ctx.globalCompositeOperation='lighter';gl(it.col.g,tx,ty,it.s*4.6*k*sc,pu*p);ctx.globalCompositeOperation='source-over';
 ctx.save();ctx.translate(tx,ty);ctx.rotate(it.p+dx*.01);ctx.scale(sc,sc);ctx.fillStyle=it.col.c;ctx.globalAlpha=.92*p;
 for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.ellipse(0,-it.s*.55,it.s*.3,it.s*.58,0,0,7);ctx.fill()}
 ctx.fillStyle='#fff6d2';ctx.beginPath();ctx.arc(0,0,it.s*.26,0,7);ctx.fill();ctx.restore();ctx.globalAlpha=1}
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=20+Math.random()*90;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,l:1+Math.random()*.8,s:6+Math.random()*10})}}
const BC=['#122234','#15283a','#193043','#1d374a','#223f54'],LC=['rgba(130,175,205,.26)','rgba(140,185,210,.3)','rgba(150,195,220,.33)','rgba(160,205,230,.36)','rgba(170,212,235,.4)'];
function drawBands(){ctx.lineCap='round';
 bands.forEach((b,i)=>{[['d',BC[i]],['l',LC[i]]].forEach(([k,c])=>{ctx.beginPath();
  for(const g of b[k]){const pr=prog(g,2.5);if(t<g.b)continue;const h=g.h*pr,dx=dxOf(g.x,g.y,h,g.l,g.p);ctx.moveTo(g.x,g.y);ctx.quadraticCurveTo(g.x+dx*.25,g.y-h*.6,g.x+dx,g.y-h*.95);g.sx=g.x+dx;g.sy=g.y-h*.95;g.vis=pr>.8}
  ctx.strokeStyle=c;ctx.lineWidth=.8+i*.5;ctx.stroke()})})}
function pick(x,y){let b=null,bd=1e9;for(const it of all){if(!it.vis)continue;const d=Math.hypot(it.sx-x,it.sy-y);if(d<it.r*(touch?1.5:1)&&d<bd){bd=d;b=it}}return b}
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;t+=dt;sx+=(sxT-sx)*.05;
 hover=(pmx>-900&&!modal)?pick(pmx,pmy):null;cv.style.cursor=hover?'pointer':'default';
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;
 ctx.drawImage(sky,0,0,W,H);
 const so=-sx*5;for(const it of stars)drawStar(it,so);
 ctx.globalCompositeOperation='lighter';
 if(V>0){nextShoot-=dt;if(nextShoot<=0){nextShoot=3+Math.random()*5;const dir=Math.random()<.5?1:-1,ang=.35+Math.random()*.25;shoot.push({x:W*(.15+Math.random()*.7),y:Math.random()*hy*.35,vx:Math.cos(ang)*dir,vy:Math.sin(ang),sp:650+Math.random()*300,l:.7+Math.random()*.5,len:140+Math.random()*100})}}
 shoot=shoot.filter(s=>{s.l-=dt;s.x+=s.vx*s.sp*dt;s.y+=s.vy*s.sp*dt;if(s.l<=0)return false;
  const tx=s.x-s.vx*s.len,ty=s.y-s.vy*s.len,q=ctx.createLinearGradient(tx,ty,s.x,s.y);q.addColorStop(0,'rgba(255,255,255,0)');q.addColorStop(1,'rgba(240,247,255,'+Math.min(1,s.l*3)+')');
  ctx.strokeStyle=q;ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.stroke();gl(GL.cool,s.x,s.y,9,Math.min(1,s.l*3));return true});
 const mx=mX-sx*9;gl(GL.moon,mx,mY,mr*6.5,.5+.06*Math.sin(t*.5));gl(GL.moon,mx,mY,mr*2.6,.5);ctx.globalAlpha=.9+.1*Math.sin(t*.4);ctx.drawImage(halo,mx-mr*8,mY-mr*8,mr*16,mr*16);ctx.globalAlpha=1;
 ctx.globalCompositeOperation='source-over';
 ctx.drawImage(moonS,mx-mr-2,mY-mr-2,mr*2+4,mr*2+4);
 for(const c of clouds){c.x+=c.sp*dt;if(c.x>W+c.w)c.x=-c.w;for(let j=0;j<3;j++)gl(GL.cloud,c.x+j*c.w*.28,c.y+Math.sin(j*2)*c.w*.03,c.w*.3,.5)}
 ctx.drawImage(back,-60-sx*4,0,W+120,H);
 ctx.drawImage(far,-60-sx*8,0,W+120,H);
 const drawMist=a=>{for(const m of mists){m.x+=m.sp*dt;if(m.x>W+m.w*.5)m.x=-m.w;ctx.globalAlpha=.3*m.a*a;ctx.drawImage(GL.mist,m.x,m.y-m.h/2,m.w,m.h)}ctx.globalAlpha=1};
 drawMist(.7);
 ctx.drawImage(mid,-60-sx*16,0,W+120,H);
 ctx.drawImage(fog,0,0,W,H);
 ctx.drawImage(near,-60,0,W+120,H);
 ctx.globalCompositeOperation='lighter';gl(GL.moon,mX,hy+H*.15,Math.min(W*.3,H*.4),.1);ctx.globalCompositeOperation='source-over';
 drawMist(.5);
 drawBands();
 for(const it of flowers)drawFlower(it);
 if(hover&&hover.k==='blade'){ctx.globalCompositeOperation='lighter';gl(GL.gold,hover.sx,hover.sy,16,.9);ctx.globalCompositeOperation='source-over'}
 ctx.globalCompositeOperation='lighter';
 parts=parts.filter(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;if(p.l<=0)return false;gl(GL.gold,p.x,p.y,p.s,Math.min(1,p.l));return true});
 ctx.globalCompositeOperation='source-over';
 ctx.drawImage(vig,0,0,W,H);
 requestAnimationFrame(frame)}
cv.addEventListener('pointermove',e=>{pmx=e.clientX;pmy=e.clientY;touch=e.pointerType==='touch';sxT=pmx/W-.5});
cv.addEventListener('pointerleave',()=>{pmx=pmy=-999});
cv.addEventListener('pointerdown',e=>{touch=e.pointerType==='touch';pmx=e.clientX;pmy=e.clientY;
 const it=pick(e.clientX,e.clientY);
 if(it){const P=PENSAMIENTOS[it.n-1]||{};$('txt').textContent='Pensamiento n.º '+it.n;$('when').textContent=fmt(P.fecha);$('what').textContent=P.texto||'';$('kind').textContent={star:'Una estrella en el cielo',flower:'Una flor en el campo',blade:'Un tallo de pasto'}[it.k];$('veil').classList.add('on');modal=true;burst(it.sx,it.sy,18)}
 else burst(e.clientX,e.clientY,5);
 if(touch)setTimeout(()=>{pmx=pmy=-999},400)});
$('veil').addEventListener('click',()=>{$('veil').classList.remove('on');modal=false});
addEventListener('keydown',e=>{if(e.key==='Escape'){$('veil').classList.remove('on');modal=false}});
// textos
function updateTexts(){$('count').textContent=V===0?'Todavía no hay nada aquí':`${V} ${V===1?'vez':'veces'} pensé en ${NOMBRE}`;
$('etapa').textContent=V===0?'':V<=MAX_ESTRELLAS?`Cielo: ${V} de ${MAX_ESTRELLAS} estrellas`:V<=MAX_ESTRELLAS+MAX_FLORES?`Campo: ${V-MAX_ESTRELLAS} de ${MAX_FLORES} flores`:`Pasto: ${nG} de ${MAX_PASTO} tallos`;}
$('hint').textContent=V===0?`Todo está en calma. Cada vez que piense en ${NOMBRE}, algo se encenderá aquí.`:'Toca una estrella, una flor o un tallo';
setTimeout(()=>$('hint').classList.add('off'),V===0?14000:9000);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,200)});
build();updateTexts();
requestAnimationFrame(frame);
})();
</script>
